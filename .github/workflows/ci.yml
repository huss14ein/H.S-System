name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Atomic workflow wiring checks
        run: npm run verify:atomic-workflows

      # Gates what ships. Remaining advisories are dev-only Netlify CLI/plugin tooling whose
      # patched versions are ESM and break Netlify's CommonJS build, so they are not force-fixed.
      - name: Security audit (production deps, high+critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Security audit (all deps, informational)
        run: npm audit || true

      - name: Build
        run: npm run build
